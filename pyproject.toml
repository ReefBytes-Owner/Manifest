# Project configuration for the Manifest repo's Python tooling.
# Single source of truth for ruff (lint + format), pytest, coverage, and pyright
# (feature 366-coding-standards, FR-013). Ruff/pytest read this automatically.

[project]
name = "manifest-agent"
version = "0.1.0"
description = "Bootstrap-free installer for Manifest agent plugin bundles"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1,<9",
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0.1,<7",
]

[project.scripts]
manifest = "manifest_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# The wheel is built FROM the sdist (`uv build`), so every force-include
# source must actually ship in the sdist or hatchling raises
# "Forced include not found" at wheel time. Hatchling's default sdist did
# not carry configs/claude/config/, which broke CI the moment the model
# policy force-includes were added. Keep this list in step with
# [tool.hatch.build.targets.wheel.force-include] below.
[tool.hatch.build.targets.sdist.force-include]
"configs/claude/config/parallel_agent.yml" = "configs/claude/config/parallel_agent.yml"
"schemas/project-checks.schema.json" = "schemas/project-checks.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "src/manifest_agent",
  "configs/claude/scripts/manifest_model_policy/__init__.py",
  "configs/claude/scripts/manifest_model_policy/controller.py",
  "configs/claude/scripts/manifest_model_policy/failures.py",
  "configs/claude/scripts/manifest_model_policy/frontmatter.py",
  "configs/claude/scripts/manifest_model_policy/resolver.py",
  "configs/claude/scripts/manifest_model_policy/skill_command.py",
  "configs/claude/scripts/manifest_model_policy/skill_execution.py",
  "configs/claude/scripts/manifest_model_policy/skill_process.py",
  "configs/claude/scripts/manifest_model_policy/skill_recovery.py",
  "configs/claude/scripts/manifest_model_policy/skill_run.py",
  "schemas/manifest-capabilities.schema.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/manifest_agent"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/manifest-capabilities.schema.json" = "manifest_agent/data/manifest-capabilities.schema.json"
"schemas/project-checks.schema.json" = "manifest_agent/data/project-checks.schema.json"
"configs/claude/config/parallel_agent.yml" = "manifest_agent/data/parallel_agent.yml"
"configs/claude/scripts/manifest_model_policy/__init__.py" = "manifest_agent/_model_policy/__init__.py"
"configs/claude/scripts/manifest_model_policy/controller.py" = "manifest_agent/_model_policy/controller.py"
"configs/claude/scripts/manifest_model_policy/failures.py" = "manifest_agent/_model_policy/failures.py"
"configs/claude/scripts/manifest_model_policy/frontmatter.py" = "manifest_agent/_model_policy/frontmatter.py"
"configs/claude/scripts/manifest_model_policy/resolver.py" = "manifest_agent/_model_policy/resolver.py"
"configs/claude/scripts/manifest_model_policy/skill_command.py" = "manifest_agent/_model_policy/skill_command.py"
"configs/claude/scripts/manifest_model_policy/skill_execution.py" = "manifest_agent/_model_policy/skill_execution.py"
"configs/claude/scripts/manifest_model_policy/skill_process.py" = "manifest_agent/_model_policy/skill_process.py"
"configs/claude/scripts/manifest_model_policy/skill_recovery.py" = "manifest_agent/_model_policy/skill_recovery.py"
"configs/claude/scripts/manifest_model_policy/skill_run.py" = "manifest_agent/_model_policy/skill_run.py"

[tool.uv.sources]
manifest-model-policy = { path = "configs/claude/scripts/manifest_model_policy", editable = true }

# Optional SDKs for the token-benchmark API path (#547). Not installed by
# default; run the harness with `uv run --group benchmark ...`.
[dependency-groups]
benchmark = [
    "anthropic",
    "google-genai",
]
dev = [
    "manifest-model-policy==0.1.0",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    # C7f: package.coordinator/config (tools/project_checks/packages.py
    # `_backend()`) runs `importlib.util.find_spec("hatchling.build")` under
    # `sys.executable` -- the interpreter already running `manifest check`
    # (Correction 4: every literal "python3" check argv rewrites to it, never
    # a PATH/store lookup). That is THIS project's own dev venv, not the
    # toolchain store's separate python-env bundle, so hatchling has to be
    # importable here for that check to ever leave BLOCKED "preprovisioned
    # build backend unavailable". Matches [build-system] requires above.
    "hatchling>=1.27,<2",
]

[tool.ruff]
# Match ruff-format's default; keeps edit-time, commit, and CI in agreement.
line-length = 88
target-version = "py311"
# Scaffolds, specs, and vendored/agent dirs are not product code.
extend-exclude = [
    "templates",
    "specs",
    ".specify",
    ".Jules",
    "node_modules",
]

[tool.ruff.lint]
# High-value, mostly auto-fixable rule groups. Deliberately omits noisy/unfixable
# groups (S/bandit, N/naming, ANN, D) for now; the changed-files gate lets the
# selection ratchet up later without a repo-wide rewrite.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# ruff-format owns line length; E501 only flags lines the formatter can't break
# (long strings/URLs) and would otherwise create noise on the changed-files gate.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately manipulate sys.path before imports (E402) and use assert
# (S101 — inert unless S is selected, kept for forward-compat).
"tests/**" = ["E402", "S101"]

[tool.ruff.format]
# Explicit, matches the existing ruff-format pre-commit hook behavior.
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# Importlib mode keeps same-basename suites in separate test directories from
# contaminating one another during full collection.
addopts = "--strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests/python"]
pythonpath = [".", "src", "tests/python"]
markers = [
    "native: isolated-home smoke tests requiring a native harness CLI",
    "network: needs ambient network/checkout state (e.g. populated git submodules) a materialized test.python candidate cannot provide -- deselected when running inside a candidate (phase-3-5-decisions.md Correction 11)",
]
# pytest-asyncio's future default, pinned explicitly (unset emits PytestDeprecationWarning).
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Advisory target; not wired as a hard CI gate (the ≥100-test floor remains the gate).
fail_under = 80
show_missing = true

[tool.pyright]
# Type-check config surface (FR-008 family / R8). Lenient + scoped: the codebase
# is largely untyped, so the pyright pre-commit hook is registered at the `manual`
# stage (opt-in: `pre-commit run pyright --hook-stage manual`) rather than blocking
# the changed-files gate until typed coverage grows.
typeCheckingMode = "basic"
include = ["configs/claude/scripts", "tests/python"]
exclude = ["templates", "specs", ".specify", ".Jules", "node_modules"]
reportMissingImports = false
reportMissingModuleSource = false
