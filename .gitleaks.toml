# Gitleaks configuration for Manifest project

title = "Manifest Gitleaks Config"

# Before this line existed, gitleaks' documented behavior is that a config
# file supplying its own [[rules]] REPLACES the built-in default ruleset
# rather than adding to it -- verified locally (gitleaks 8.30.1): the
# default `generic-api-key` rule does not fire against this config without
# `useDefault`, only the five custom rules below do. That silently narrowed
# secret detection to five hand-picked patterns. `useDefault = true` makes
# the rules below additive to gitleaks' ~150 built-in detectors instead
# (config/check-preservation.json "equivalence" entry: hook.gitleaks).
[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[a-zA-Z0-9\-_]{95}'''
tags = ["key", "Anthropic"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[a-zA-Z0-9]{48}'''
tags = ["key", "OpenAI"]

[[rules]]
id = "google-api-key"
description = "Google API Key"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
tags = ["key", "Google"]

[[rules]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = '''ghp_[0-9a-zA-Z]{36}'''
tags = ["key", "GitHub"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["key", "AWS"]

[allowlist]
description = "Allowlist for false positives"
paths = [
  '''\.Jules/''',
  '''templates/commands/''',
  '''templates/patterns/''',
  '''docs/SHELL_ANALYSIS_REPORT\.md''',
  '''docs/VALIDATION_REPORT\.md''',
  # Deliberately secret-shaped equivalence fixtures (config/check-preservation.json
  # "equivalence" entries); their "invalid" half must trip gitleaks under direct
  # invocation, not be reported as a real finding on this repo's own scan.
  '''tests/fixtures/equivalence/gitleaks/''',
]
regexes = [
  '''sk-ant-example-[a-zA-Z0-9\-_]{95}''',
  '''sk-example[a-zA-Z0-9]{48}''',
  '''example.*api.*key''',
]
