name: Dependency Audit

on:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Release dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MANIFEST_TOOLCHAIN_STORE: ${{ runner.temp }}/manifest-toolchain
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: false

      - name: Provision attested Linux toolchain
        run: |
          set -euo pipefail
          uv run manifest provision \
            --lock config/toolchain.lock.json \
            --platform linux-x64 \
            --json

      - name: Run release dependency audits
        run: |
          set -euo pipefail
          set +e
          uv run manifest check release \
            --group security \
            --project-config config/project-checks.json \
            --base "${GITHUB_SHA}" \
            --json \
            --output "${RUNNER_TEMP}/dependency-audit.json"
          set -e
          python3 - "${RUNNER_TEMP}/dependency-audit.json" <<'PY'
          import json
          import sys

          expected = {'dependency.audit.python', 'dependency.audit.node'}
          with open(sys.argv[1], encoding='utf-8') as handle:
              receipt = json.load(handle)
          statuses = {
              result['id']: result['status']
              for result in receipt.get('results', [])
              if result.get('id') in expected
          }
          bad = {
              check_id: statuses.get(check_id, 'MISSING')
              for check_id in expected
              if statuses.get(check_id) != 'PASS'
          }
          if bad:
              raise SystemExit(f'scheduled dependency audit did not pass: {bad}')
          print(f'scheduled dependency audits passed: {statuses}')
          PY

      - name: Upload dependency audit receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-audit.json
          retention-days: 30
          if-no-files-found: error
