name: Manifest CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked story-PRs (e.g. 003-us4 -> 003-us3) must
  # run CI too, not only PRs that target main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Validate
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Full history so pre-commit can diff changed files against the base ref.
          fetch-depth: 0

      # .apm/skills is GENERATED from plugins/*/skills/* (T3.3, spec 674) and is
      # gitignored, so a fresh clone has no mirror. Every consumer below still
      # reads that path -- the COMMANDS.md drift check, the ai-hooks pytest, the
      # structure count, and the configs/claude/skills symlink -- so the mirror
      # must exist before any of them run. Without this the jobs fail on an
      # EMPTY tree, which several of them would otherwise report as agreeing
      # with itself.
      - name: Generate skill mirror (.apm/skills from plugins/)
        run: configs/claude/scripts/generate_skill_mirror.sh

      # --- ShellCheck ---

      # Installed from the same pinned wheel .pre-commit-config.yaml uses
      # (shellcheck-py v0.11.0.1), NOT the distro package. Two reasons:
      # apt-get reaches archive.ubuntu.com with no timeout, and a stalled
      # mirror hung this step for the full 6h job default twice on
      # 2026-08-19 (#791); and the distro build was shellcheck 0.9.0, two
      # minor versions behind the repo's own pin, so CI and local pre-commit
      # could disagree about what passes. Matches the `pip install
      # yamllint==...` pattern below. Version still logged (specs/003 FR-014).
      - name: Install shellcheck
        run: |
          pip install shellcheck-py==0.11.0.1
          shellcheck --version

      # -S warning: fail on real warnings/errors, not cosmetic info/style notes
      # (e.g. SC2129 grouped-redirect suggestions). Keeps CI signal meaningful.
      - name: ShellCheck - configs/claude/scripts/
        run: shellcheck -S warning configs/claude/scripts/*.sh

      - name: ShellCheck - bootstrap/
        run: |
          shellcheck -S warning bootstrap.sh
          shellcheck -S warning bootstrap/lib/*.sh

      # Empty-array expansions unsafe under macOS Bash 3.2 + set -u
      # (specs/003 FR-011; same check runs as a pre-commit hook)
      - name: Check empty-array expansions (Bash 3.2 set -u)
        run: tests/lint/check_array_expansion.sh

      # (issue #479; same check runs as a pre-commit hook)
      - name: Check bats assertions (Bash 3.2 silent pass)
        run: tests/lint/check_bats_assertions.sh

      # Proves the STAGED/committed tree is self-contained: extracts
      # `git archive $(git write-tree)` and runs the vendored runtime from a
      # third directory, so a file present only in a dev working tree fails
      # here instead of at a user's install. Hermetic, offline, ~8s.
      - name: Check fresh-checkout self-containment
        run: tests/lint/check_fresh_checkout.sh

      # --- yamllint ---

      # Pinned to match .pre-commit-config.yaml (specs/003 FR-014).
      - name: Install yamllint
        run: pip install yamllint==1.38.0

      # Use the repo's .yamllint (max-line 150, warning) rather than the built-in
      # `relaxed` preset, which forces an 80-col limit the project does not adopt.
      - name: yamllint - configs/claude/config/
        run: yamllint configs/claude/config/*.yml

      # --- markdownlint ---

      - name: markdownlint - key docs
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24
        with:
          globs: |
            AGENTS.md
            CLAUDE.md
            README.md
            docs/*.md

      # --- YAML validation with Python ---

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"

      - name: Validate YAML configs with Python
        run: |
          pip install pyyaml==6.0.2
          exit_code=0
          for f in configs/claude/config/*.yml; do
            echo "Validating $f ..."
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || exit_code=1
          done
          if [ "$exit_code" -ne 0 ]; then
            echo "YAML validation failed"
          else
            echo "All YAML configs valid"
          fi
          exit $exit_code

      # docs/COMMANDS.md is GENERATED from the skill source of truth; a stale
      # commit must fail the build (spec 362 FR-004/SC-002). pyyaml is installed
      # by the YAML-validation step above (command_catalog.py imports it).
      - name: Verify docs/COMMANDS.md is up-to-date with skills
        run: |
          if ! configs/claude/scripts/generate_commands_doc.py --check; then
            echo ""
            echo "FAIL: docs/COMMANDS.md is out of sync with .apm/skills/."
            echo "Run 'configs/claude/scripts/generate_commands_doc.py' and commit the result."
            exit 1
          fi
          echo "docs/COMMANDS.md is up-to-date"

      # --- manifest-runtime uv gates (spec manifest-uv-cli, task 10) ---
      - name: Install uv
        run: pip install uv

      # Bundle-local reference gate: a skill or runtime script must not cite a
      # path absent from its own bundle (bundles install independently).
      # Must stay BELOW `Install uv` -- it was briefly placed above it, where
      # `uv run` exits 127 (command not found) before the gate ever runs.
      - name: Check bundle-local references
        run: uv run python tools/check_bundle_link_references.py

      - name: Verify bootstrap-free plugin release projections
        run: |
          set -euo pipefail
          uv run python tools/generate_plugin_views.py --check
          uv run python tools/vendor_bundle_dependencies.py --check
          uv run python tools/check_plugin_runtime_paths.py --json
          # Agent-frontmatter gate: a bare `agent: name` silently resolves to
          # general-purpose once skills are plugin-scoped, so it must be
          # namespaced `plugin:agent`. Wired here rather than left as an
          # opt-in utility -- a checker nothing runs closes nothing.
          uv run python tools/check_agent_frontmatter.py
          uv run python tools/render_capability_inventory.py --check
          uv run python tools/render_plugin_capability_matrix.py --check \
            --inspection tests/fixtures/plugin_capability_inspection.json

      - name: Build and checksum coordinator wheel
        run: |
          set -euo pipefail
          rm -rf dist
          uv build
          shasum -a 256 dist/*

      - name: uv lock --check (configs/claude)
        run: uv lock --check --project configs/claude

      - name: uv build (configs/claude)
        run: uv build --project configs/claude

      # manifest-delegate ships its own pyproject/uv.lock. Without these it is
      # the one packaging surface in the repo with no build-time verification,
      # so its lockfile could drift silently.
      - name: uv lock --check (plugins/manifest-delegate)
        run: uv lock --check --project plugins/manifest-delegate

      # --- pre-commit on changed files: the no-bypass gate of record (feature 366) ---
      # Runs the repo's .pre-commit-config.yaml against files changed in this
      # PR/push so standards (ruff, shfmt, gitleaks, markdownlint, ...) cannot be
      # bypassed by skipping local hooks. Scoped to CHANGED files (not --all-files)
      # due to pre-existing debt — see specs/366-coding-standards/spec.md.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ]; then
            # Pull request: diff against the target branch.
            git fetch --no-tags origin "$BASE_REF"
            pre-commit run --from-ref "origin/$BASE_REF" --to-ref HEAD --show-diff-on-failure
          elif git rev-parse HEAD~1 > /dev/null 2>&1; then
            # Push with a parent commit: diff against it.
            pre-commit run --from-ref HEAD~1 --to-ref HEAD --show-diff-on-failure
          else
            # First commit / no parent: fall back to the full tree.
            pre-commit run --all-files --show-diff-on-failure
          fi

  test:
    name: Test
    timeout-minutes: 30
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # bats-support / bats-assert under tests/test_helper are git submodules
          submodules: true

      # .apm/skills is GENERATED from plugins/*/skills/* (T3.3, spec 674) and is
      # gitignored, so a fresh clone has no mirror. Every consumer below still
      # reads that path -- the COMMANDS.md drift check, the ai-hooks pytest, the
      # structure count, and the configs/claude/skills symlink -- so the mirror
      # must exist before any of them run. Without this the jobs fail on an
      # EMPTY tree, which several of them would otherwise report as agreeing
      # with itself.
      - name: Generate skill mirror (.apm/skills from plugins/)
        run: configs/claude/scripts/generate_skill_mirror.sh

      # --- Bats tests (helpers provided by the submodules above) ---

      # Cache keyed on the pinned version string so a pin bump invalidates
      # the cache (specs/003 FR-014 edge case).
      - name: Cache bats install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: node_modules
          key: bats-1.11.1-${{ runner.os }}

      - name: Install bats (pinned)
        run: npm install bats@1.11.1

      - name: Install uv
        run: pip install uv

      - name: Sync manifest runtime (bats tests stub ~/.claude/.venv from this tree)
        run: uv sync --project configs/claude

      # Retained after spec 674 Phase 5 retired apm_publish_gate.sh: gitleaks is
      # still the repo's secret scanner. Formerly justified as (no regex-only
      # degrade), so without this the APM publish-gate bats fail in CI while
      # passing on any dev box that has it from Homebrew — an ambient-dependency
      # split. Pinned and checksum-verified against the release's own
      # checksums.txt: installing a secret-scanner unverified would defeat the
      # point of the gate it feeds.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "$base/$tarball"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -fsSL -o "$sums" "$base/$sums"
          grep " ${tarball}\$" "$sums" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" "$sums" gitleaks
          gitleaks version

      - name: Run bats tests
        run: ./node_modules/.bin/bats tests/bats/

      # --- Python tests ---

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt

      - name: Install test and manifest runtime dependencies (pinned)
        # parallel_agent.py hard-imports yaml + rich (sys.exit(1) otherwise);
        # asyncio-throttle backs RateLimiter. requirements-runtime.txt mirrors
        # configs/claude/uv.lock core deps for manifest_cli / scripts packages.
        #
        # manifest-model-policy is a LOCAL-ONLY development/runtime package.
        # The published coordinator wheel vendors its code and has no external
        # dependency on this unregistered name, while source tests import the
        # editable package. Install that package from its reviewed path before
        # the root project; tests/python/test_requirements_drift.py enforces it.
        run: |
          pip install -e ./configs/claude/scripts/manifest_model_policy
          pip install -r tests/requirements-ci.txt -r tests/requirements-runtime.txt .

      - name: Delegate a cgroup v2 subtree (containment tests, #740)
        # Without this the escape tests SKIP on Linux and the job still reports
        # green -- which is what #862 first shipped: containment code executed on
        # no machine anywhere. /sys/fs/cgroup is root-owned, so an unprivileged
        # runner needs a chowned subtree, the same shape a real deployment gets.
        # Non-fatal: a runner image without cgroup v2 must not break every PR.
        # test_linux_ci_actually_exercises_containment is what turns a missing
        # subtree into a loud failure rather than a silent skip.
        run: |
          set -u
          root=/sys/fs/cgroup
          if [ -f "$root/cgroup.controllers" ]; then
            sudo mkdir -p "$root/manifest-ci" || true
            sudo chown -R "$(id -u):$(id -g)" "$root/manifest-ci" || true
            # Delegate the controllers the child subtree needs.
            echo "MANIFEST_CGROUP_ROOT=$root/manifest-ci" >> "$GITHUB_ENV"
            echo "delegated $root/manifest-ci to $(id -un)"
          else
            echo "cgroup v2 not mounted on this runner"
          fi

      - name: Run Python tests (if any exist)
        run: |
          if [ -d tests/python ] && find tests/python -name '*.py' | grep -q .; then
            pytest tests/python/ -v -m "not native"
          else
            echo "No Python tests found in tests/python/ - skipping"
          fi

      - name: Run skill-local Python tests (ai-hooks-integration runtime)
        # Separate invocation on purpose: this suite is its own `tests` package,
        # so adding it to pytest testpaths collides with the repo's tests/
        # (ModuleNotFoundError: tests.test_unified_hook). It guards code that
        # runs on every hook fire, so it must not stay outside CI. No
        # "skipping" branch — the path is known to exist, and a check that
        # silently skips is a false green.
        run: pytest .apm/skills/ai-hooks-integration/tests/ -v

      - name: Run smoke tests (tier Lite — P-VI Verify gate)
        # Deterministic, browser-free critical-path smoke (smoke-catalog/*.yaml).
        run: |
          if [ -d smoke-catalog ] && find smoke-catalog -name '*.yaml' | grep -q .; then
            configs/claude/.venv/bin/manifest smoke run --app manifest --tier Lite --catalog-dir smoke-catalog
          else
            echo "No smoke-catalog/ found - skipping"
          fi

  validate:
    name: Validate Structure
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # This job runs bats too (bundle partition invariants, below), and
          # bats-support / bats-assert live under tests/test_helper as git
          # submodules. Without this the suite dies in bats-gather-tests on a
          # bats_load_safe failure -- before a single assertion runs, so the
          # gate reports a load error rather than an invariant.
          submodules: true

      # .apm/skills is GENERATED from plugins/*/skills/* (T3.3, spec 674) and is
      # gitignored, so a fresh clone has no mirror. Every consumer below still
      # reads that path -- the COMMANDS.md drift check, the ai-hooks pytest, the
      # structure count, and the configs/claude/skills symlink -- so the mirror
      # must exist before any of them run. Without this the jobs fail on an
      # EMPTY tree, which several of them would otherwise report as agreeing
      # with itself.
      - name: Generate skill mirror (.apm/skills from plugins/)
        run: configs/claude/scripts/generate_skill_mirror.sh

      # generate_cursor_rules.sh emits the command-index rule via
      # generate_commands_doc.py (imports pyyaml), and regenerates
      # configs/cursor/mcp.json via generate_cursor_mcp.py (also pyyaml);
      # without it both steps silently skip and drift would pass unnoticed
      # (spec 362 T015; spec 2026-07-11 cursor-feature-parity WS-1).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"

      - name: Install pyyaml (for command-index + mcp.json generation)
        run: pip install pyyaml==6.0.2

      - name: Verify symlinks are intact
        run: |
          echo "Checking symlinks..."
          ERRORS=0

          check_symlink() {
            local link="$1"
            local expected_target="$2"
            if [ ! -L "$link" ]; then
              echo "FAIL: $link is not a symlink"
              ERRORS=$((ERRORS + 1))
            else
              actual=$(readlink "$link")
              if [ "$actual" != "$expected_target" ]; then
                echo "FAIL: $link -> $actual (expected $expected_target)"
                ERRORS=$((ERRORS + 1))
              else
                echo "OK: $link -> $actual"
              fi
            fi
          }

          # configs/claude skills source-of-truth symlink (-> .apm/skills)
          check_symlink "configs/claude/skills"   "../../.apm/skills"

          # configs/cursor symlinks
          check_symlink "configs/cursor/scripts"  "../claude/scripts"
          check_symlink "configs/cursor/config"   "../claude/config"
          check_symlink "configs/cursor/prompts"  "../claude/prompts"
          check_symlink "configs/cursor/.plans"   "../claude/.plans"

          # configs/gemini symlinks
          check_symlink "configs/gemini/scripts"  "../claude/scripts"
          check_symlink "configs/gemini/config"   "../claude/config"
          check_symlink "configs/gemini/prompts"  "../claude/prompts"
          check_symlink "configs/gemini/.plans"   "../claude/.plans"

          # configs/codex symlinks
          check_symlink "configs/codex/AGENTS.md" "../../AGENTS.md"
          check_symlink "configs/codex/scripts"   "../claude/scripts"
          check_symlink "configs/codex/config"    "../claude/config"
          check_symlink "configs/codex/prompts"   "../claude/prompts"
          check_symlink "configs/codex/.plans"    "../claude/.plans"

          # configs/antigravity symlinks (the only platform dir with a
          # repo-level skills symlink — see issue #328). No scripts/prompts:
          # agy is a parallel_agent provider, not an orchestrator that runs
          # parallel_agent.py, so it does not carry the orchestrator wiring.
          check_symlink "configs/antigravity/config"  "../claude/config"
          check_symlink "configs/antigravity/skills"  "../claude/skills"
          check_symlink "configs/antigravity/.plans"  "../claude/.plans"

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "$ERRORS symlink(s) broken or missing"
            exit 1
          fi
          echo ""
          echo "All symlinks intact"

      - name: Reject paths differing only by case
        run: |
          # Case-insensitive filesystems (macOS/Windows) collapse such paths,
          # silently corrupting whichever casing loses (see issue #303).
          dupes=$(git ls-files | sort -f | uniq -di)
          if [ -n "$dupes" ]; then
            echo "FAIL: tracked paths differ only by case:"
            echo "$dupes"
            exit 1
          fi
          echo "OK: no case-colliding paths"

      - name: Validate all shell scripts syntax
        run: |
          echo "Validating shell script syntax with bash -n..."
          ERRORS=0

          for f in configs/claude/scripts/*.sh bootstrap.sh bootstrap/lib/*.sh; do
            if bash -n "$f" 2>/dev/null; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              bash -n "$f"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "$ERRORS script(s) have syntax errors"
            exit 1
          fi
          echo ""
          echo "All shell scripts pass syntax check"

      - name: Count and verify skills and scripts
        run: |
          echo "=== Skills ==="
          # -L follows the configs/claude/skills symlink into .apm/skills
          # (the source of truth). Without -L, find does not traverse the symlink.
          SKILL_COUNT=$(find -L configs/claude/skills -name 'SKILL.md' | wc -l | tr -d ' ')
          echo "Found $SKILL_COUNT skills:"
          find -L configs/claude/skills -name 'SKILL.md' | sed 's|/SKILL.md||;s|configs/claude/skills/||' | sort | sed 's/^/  /'
          echo ""

          echo "=== Scripts ==="
          SCRIPT_COUNT=$(find configs/claude/scripts -name '*.sh' | wc -l | tr -d ' ')
          echo "Found $SCRIPT_COUNT scripts:"
          find configs/claude/scripts -name '*.sh' | sort | sed 's|configs/claude/scripts/||;s/^/  /'
          echo ""

          # T1.6 (spec 674): EXACT, against an exogenous committed integer.
          # This was `-lt 10`, which is not a gate: a bundle silently losing 17
          # skills during the plugin move stays green, and so does any accident
          # that drops 98 of them. Both sides of a `-lt` floor are derived from
          # the same tree, so it can only ever confirm the tree agrees with
          # itself. The global catalog expected_total lives in skill_policies.yml
          # precisely because the move cannot edit it -- a PR that legitimately
          # adds or removes a skill must change that integer in the same commit.
          EXPECTED=$(sed -n 's/^expected_total:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
            configs/claude/config/skill_policies.yml)
          if [ -z "$EXPECTED" ]; then
            echo "FAIL: configs/claude/config/skill_policies.yml declares no expected_total"
            exit 1
          fi
          if [ "$SKILL_COUNT" -ne "$EXPECTED" ]; then
            echo "FAIL: expected exactly $EXPECTED skills, found $SKILL_COUNT."
            echo "      If this change adds or removes a skill, update expected_total"
            echo "      in configs/claude/config/skill_policies.yml in the same commit."
            exit 1
          fi
          if [ "$SCRIPT_COUNT" -lt 1 ]; then
            echo "FAIL: Expected at least 1 script, found $SCRIPT_COUNT"
            exit 1
          fi

          echo "Structure validation passed: $SKILL_COUNT skills, $SCRIPT_COUNT scripts"

      - name: No absolute skills-tree paths in skill bodies
        # T1.4 (spec 674). A skill body citing ~/.claude/skills/<other>/... reads
        # a path that will not exist once skills live in a version-pathed plugin
        # cache. It fails SILENTLY: on a GitLab repo /ci-harden-workflow would
        # load nothing, harden using only the GitHub branch of its own body,
        # leave the pwn-request surface open, and report success. Shared
        # references belong in ~/.claude/references/, which bootstrap owns.
        run: |
          if grep -rn --include='SKILL.md' -e '\.claude/skills/' .apm/skills/; then
            echo ""
            echo "FAIL: a skill body hard-codes a path into the skills tree."
            echo "      Move the shared file under configs/claude/references/ and"
            echo "      cite it as ~/.claude/references/..., or keep it in the"
            echo "      skill's OWN references/ dir and cite it relatively."
            exit 1
          fi
          echo "No absolute skills-tree paths in skill bodies"

      - name: Bundle partition invariants
        # T3.6 (spec 674). Pure python3 + bats, NO claude CLI: `grep -c
        # 'claude plugin' ci.yml` was 0 before this feature, so any gate phrased
        # as `claude plugin validate --strict` is unrunnable here or skips
        # green, and a skip that renders as a pass is the false green this phase
        # exists to remove.
        run: npx bats tests/bats/bundle_partition.bats

      - name: Cross-skill references resolve after plugin scoping
        # T1.3 (spec 674). Post-cutover a skill is reachable only as
        # <plugin>:<skill>, so a bare cross-skill reference stops resolving and
        # the sub-agent that hit it improvises and reports SUCCESS — no error,
        # no log line. This gate is the only thing that can catch that class,
        # because no runtime test can: the failure mode is a green report.
        #
        # Deliberately NOT a `grep '/<name>'`. That form sees 20 of the 35
        # blocking references and is blind to dispatches written without a slash —
        # including docs-all, whose whole failure mode is a fabricated
        # per-skill success table, and generate-design's **bold** delegation.
        run: |
          python3 configs/claude/scripts/skill_reference_check.py \
            --registry configs/claude/config/skill_policies.yml \
            --baseline configs/claude/config/skill_reference_baseline.json

      - name: Verify Cursor rules are up-to-date with skills
        run: |
          bash configs/claude/scripts/generate_cursor_rules.sh
          # git diff misses brand-new (untracked) rule files — PR #285's 45
          # skills shipped without rules and this check stayed green. Check
          # the porcelain status (tracked changes AND untracked files).
          # configs/cursor/mcp.json is generated by the same script from
          # configs/claude/config/mcp_servers.yml (spec 2026-07-11
          # cursor-feature-parity WS-1) — drift there fails the same gate.
          # configs/cursor/agents/ is generated by generate_cursor_agents.py
          # from configs/claude/agents/ (spec 2026-07-11 cursor-feature-parity
          # WS-5) — drift there fails the same gate too.
          if [ -n "$(git status --porcelain configs/cursor/rules/ configs/cursor/mcp.json configs/cursor/agents/)" ]; then
            git status --porcelain configs/cursor/rules/ configs/cursor/mcp.json configs/cursor/agents/
            echo ""
            echo "FAIL: Cursor rules/mcp.json/agents are out of sync with source."
            echo "Run 'configs/claude/scripts/generate_cursor_rules.sh' and commit the result."
            exit 1
          fi
          echo "Cursor rules, mcp.json, and agents are up-to-date"
