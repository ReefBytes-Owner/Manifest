name: Attest Linux Toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-attest-linux
  cancel-in-progress: false

jobs:
  attest-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: false

      - name: Materialize and report linux-x64 digests
        env:
          MANIFEST_TOOLCHAIN_STORE: ${{ runner.temp }}/manifest-toolchain
        run: |
          set -euo pipefail
          uv run manifest provision \
            --lock config/toolchain.lock.json \
            --platform linux-x64 \
            --json | tee linux-x64-attestations.json

      - name: Upload reviewed attestation input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-x64-toolchain-attestations-${{ github.run_id }}
          path: linux-x64-attestations.json
          if-no-files-found: error
          retention-days: 30
