# Pre-commit hooks for Manifest project
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# Version pins refreshed via `pre-commit autoupdate` (feature 366, 2026-06-29)
# and validated by running the suite on changed files. Dormant-language hooks
# (Go/Rust/Terraform) are file-scoped and only run when matching sources appear.

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # *.patch is excluded because trailing whitespace is SEMANTIC in a diff:
        # a blank context line is a single space, and trimming it makes the file
        # fail `git apply`. The hook silently corrupted
        # specs/674-plugin-architecture/patches/ on every run.
        # PyYAML source and license bytes are verified against VENDOR.json and
        # the locked sdist; formatting either would corrupt the vendored copy.
        # Same for the i-have-adhd mirror: its bytes are sha256-pinned in
        # upstream-lock.json, and guidance/ is derived from the pinned SKILL.md,
        # so any reformat breaks verify_mirror and the provenance claim.
        exclude: "^(\\.Jules/|docs/templates/|plugins/manifest-code-quality/skills/smoke-manage/vendor/(LICENSE\\.PyYAML|yaml/)|plugins/manifest-i-ha\
          ve-adhd/(skills/|guidance/|devin/|LICENSE\\.upstream))|\\.patch$"
      - id: end-of-file-fixer
        # configs/cursor/rules/ are generated by generate_cursor_rules.sh, which
        # emits a trailing blank line; excluding them keeps the generator (and the
        # "Cursor rules up-to-date" CI check) authoritative instead of fighting it.
        exclude: "^(\\.Jules/|docs/templates/|configs/cursor/rules/|plugins/manifest-code-quality/skills/smoke-manage/vendor/(LICENSE\\.PyYAML|yaml/)\
          |plugins/manifest-i-have-adhd/(skills/|guidance/|devin/|LICENSE\\.upstream))"
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^(\.Jules/)
      - id: check-json
        exclude: ^(\.Jules/)
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        # .bats carry a `#!/usr/bin/env bats` shebang for tooling but are run via
        # the bats runner (not executed directly), so they are intentionally
        # non-executable — matches all existing tests/bats/*.bats (feature 366).
        # .tmpl are script TEMPLATES rendered to a destination path by a loader;
        # the shebang belongs to the rendered output, not to the template file,
        # which is never executed in place (CON-004 extraction, 2026-07-30).
        exclude: \.(bats|tmpl)$
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
        # Preserve the exact upstream files covered by VENDOR.json hashes and
        # the sha256-pinned i-have-adhd mirror.
        exclude: "^(plugins/manifest-code-quality/skills/smoke-manage/vendor/(LICENSE\\.PyYAML|yaml/)|plugins/manifest-i-have-adhd/(skills/|guidance/\
          |devin/|LICENSE\\.upstream))"
      # Fast Python pre-flight (feature 366): syntax + stray debug statements.
      - id: check-ast
        types_or: [python, pyi]
      - id: debug-statements
        types_or: [python, pyi]

  # Shell script checking
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        # .bats use bats `@test {}` syntax that shellcheck cannot parse; they are
        # exercised by the bats runner in CI instead (feature 366).
        exclude: (^\.Jules/|\.bats$)

  # Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        # -ln bash: parse as Bash (matches repo shebangs / Bash 3.2 idioms).
        args: ['-i', '4', '-ci', '-sr', '-ln', 'bash', '-w']
        # .bats use bats syntax shfmt cannot parse (feature 366).
        exclude: (^\.Jules/|\.bats$)

  # Markdown linting
  # Switched from igorshubovych/markdownlint-cli (v0.49.0, unrelated Ruby-era
  # tool) to DavidAnson/markdownlint-cli2's own pre-commit hook, pinned to the
  # same v0.23.0 engine line CI runs via markdownlint-cli2-action (v23) and
  # that ships with local `brew install markdownlint-cli2` — closes a version
  # skew where local/CI could pass while pre-commit's older engine flagged
  # (or missed) different rule violations (feature 366 follow-up, unit U8).
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        args: ['--config', '.markdownlint.jsonc', '--fix']
        # Vendored/scaffold/generated content the repo does not own
        # stylistically (unit U8). Deliberate coverage tradeoff: the
        # changed-files CI gate previously DID lint these paths when a PR
        # touched them — and then failed on pre-existing upstream style
        # debt unrelated to the PR. Excluding them trades that coverage
        # for non-blocking edits to vendored content:
        #   - specs/, docs/superpowers/ — spec-kit / brainstorming planning
        #     artifacts (long task lines, generated tables, embedded code).
        #   - .specify/ — upstream spec-kit scaffold (templates, extensions).
        #   - .claude/skills/speckit-* — vendored speckit skill docs mirrored
        #     from spec-kit, not authored to this repo's markdown style.
        #   - .jules/ — Jules agent persona scaffold, same class as .Jules/.
        #   - node_modules/ — third-party deps (also globally excluded below;
        #     listed here too so this hook's scope is self-documenting).
        #   - docs/templates/, docs/SHELL_ANALYSIS_REPORT.md,
        #     docs/VALIDATION_REPORT.md — pre-existing report/template docs
        #     (feature 366).
        #   - .apm/skills/ — the generated mirror; its sources are linted.
        #   - plugins/stitch-design/ — externally-sourced skill content (the
        #     Stitch Design Skills family) vendored from an upstream repo not
        #     authored to this repo's 120-col/heading conventions; rewrapping
        #     prose to fit would fight every upstream re-sync instead of
        #     diffing cleanly. 237 of the 260 findings under plugins/ are here.
        #     Manifest's OWN skill docs are NOT excluded: pre-cutover they sat
        #     under .apm/skills/ and this pattern exempted them by accident of
        #     location rather than by decision, so the cutover is where that
        #     gets corrected (the other 23 findings were fixed, not muted).
        #   - plugins/manifest-i-have-adhd/{skills,guidance,devin}/ — the
        #     upstream i-have-adhd mirror. Its bytes are sha256-pinned in
        #     upstream-lock.json and guidance/ is derived from the pinned
        #     SKILL.md, so --fix rewrites break verify_mirror and void the
        #     provenance claim (caught 2026-08-17: two sync tests went red).
        # This keeps the changed-files CI gate (pre-commit run --files ...)
        # from failing on files the repo does not control the prose of.
        exclude: "^(\\.Jules/|\\.jules/|specs/|docs/superpowers/|docs/templates/|docs/SHELL_ANALYSIS_REPORT\\.md|docs/VALIDATION_REPORT\\.md|\\.speci\
          fy/|\\.claude/skills/speckit-[^/]+/|node_modules/|\\.apm/skills/|plugins/stitch-design/|plugins/manifest-i-have-adhd/(skills/|guidance/|de\
          vin/))"

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: ^(\.Jules/)

  # Python linting + formatting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ['--fix']
        types_or: [python, pyi]
        exclude: ^plugins/manifest-code-quality/skills/smoke-manage/vendor/yaml/
      - id: ruff-format
        types_or: [python, pyi]
        exclude: ^plugins/manifest-code-quality/skills/smoke-manage/vendor/yaml/

  # Go linting (golangci-lint) — DORMANT (no .go files yet); v2 config schema.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        types_or: [go]

  # JavaScript/TypeScript linting (ESLint) — kept at v9.x to match the pinned
  # additional_dependencies (out of scope for feature 366; dormant — no tracked .js).
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.18.0
    hooks:
      - id: eslint
        types_or: [javascript, jsx, ts, tsx]
        # Vendored content (e.g. the Stitch Design Skills family) ships its own
        # .ts/.js scripts but has no eslint.config.js of its own, and this repo
        # has never set up flat-config eslint (dormant per the
        # additional_dependencies note above) — running eslint against it just
        # fails on a missing config, not real findings.
        #
        # plugins/stitch-design/ is where that family lives after the cutover;
        # .apm/skills/ is its generated mirror. Excluding only the mirror left
        # the real source linted, which is how a dormant hook started failing.
        exclude: ^(templates/|\.Jules/|\.apm/skills/|plugins/stitch-design/|plugins/manifest-code-quality/skills/project-scaffold/templates/)
        additional_dependencies:
          - eslint@9.18.0

  # Terraform fmt + lint + security — DORMANT (no .tf files yet; types_or scopes
  # these so they only run when real Terraform appears). tfsec is DEPRECATED
  # (merged into Trivy, 2024) -> use terraform_trivy (feature 366).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.0
    hooks:
      - id: terraform_fmt
        types_or: [terraform]
      - id: terraform_validate
        types_or: [terraform]
      - id: terraform_tflint
        types_or: [terraform]
      - id: terraform_trivy
        types_or: [terraform]

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Custom checks
  - repo: local
    hooks:
      # Code Constitution structural gate (configs/claude/config/code_constitution.yml).
      # Catches what the language linters do not look for: size ceilings, god
      # objects, duplicated blocks, embedded JSON/YAML/Markdown payloads, and
      # swallowed exceptions.
      #
      # RATCHETED, not retroactive. At adoption this repo carried 71 blocking
      # violations across 37 files; gating on those would have failed the first
      # PR to touch any of them on debt it did not create, which is how a gate
      # teaches people to bypass it. So counts are recorded in
      # configs/claude/config/constitution_baseline.json and only a RISE blocks.
      # Fixing a violation lowers the entry permanently; raising one needs the
      # reason in the commit message.
      #   regenerate: configs/claude/scripts/constitution_check.py --update-baseline FILE
      #   see everything: configs/claude/scripts/constitution_check.py --no-baseline FILE
      - id: constitution-check
        name: Code Constitution (size, duplication, payloads, errors, dangerous ops)
        entry: configs/claude/scripts/constitution_check.py
        language: system
        files: \.(py|pyi|sh|bash|go|tf|tfvars|ts|tsx|js|jsx|mjs|cjs)$
        # Scaffold templates are not product code; .Jules/, node_modules, and
        # checked release bundles are generated/vendored. Their authored source
        # remains in scope for the constitution check.
        exclude: "^(\\.Jules/|\\.jules/|node_modules/|templates/scaffold/|specs/|plugins/stitch-design/runtime/dist/|plugins/manifest-code-quality/sk\
          ills/smoke-manage/vendor/yaml/)"

      # Validate bootstrap.sh syntax
      - id: validate-bootstrap
        name: Validate bootstrap.sh syntax
        entry: bash -n
        language: system
        files: ^bootstrap\.sh$

      # Non-final bare [[ ]] assertions silently pass in bats on macOS
      # Bash 3.2 (issue #479; same check runs as a CI lint step)
      - id: check-bats-assertions
        name: Check bats assertions (Bash 3.2 silent pass)
        entry: tests/lint/check_bats_assertions.sh
        language: system
        files: \.bats$

      # Empty-array expansions unsafe under macOS Bash 3.2 + set -u
      # (specs/003 FR-011; same check runs as a CI lint step)
      - id: check-array-expansion
        name: Check empty-array expansions (Bash 3.2 set -u)
        entry: tests/lint/check_array_expansion.sh
        language: system
        types: [shell]
        # identify tags .bats as shell; exclude them like the other shell hooks.
        exclude: (^\.specify/|\.bats$)

      # Check for hardcoded credentials
      - id: check-credentials
        name: Check for hardcoded credentials
        entry: >-
          bash -c 'if grep -rn "sk-[a-zA-Z0-9]\{32,\}"
          --include="*.sh" --include="*.md"
          --include="*.yaml" --include="*.json" .;
          then exit 1; fi'
        language: system
        pass_filenames: false

      # Validate YAML config files
      - id: validate-yaml-configs
        name: Validate YAML config files
        entry: python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]"
        language: system
        files: ^configs/claude/config/.*\.yml$

      # Cursor rules/mcp.json/agents drift — local mirror of the CI "Cursor
      # rules up-to-date" gate (spec 2026-07-11 cursor-feature-parity WS-6),
      # so drift is caught before a PR rather than only in CI. --dry-run never
      # mutates, and reports drift on stdout rather than via its exit code --
      # so drift is found by scanning its report lines. It CAN still exit
      # non-zero (e.g. a stale .apm/skills mirror), and stderr must be merged
      # and the status checked, or that failure reads as a green pass.
      - id: check-cursor-rules-drift
        name: Check Cursor rules/mcp.json/agents drift (dry-run)
        entry: >-
          bash -c '
          if ! out=$(configs/claude/scripts/generate_cursor_rules.sh --dry-run 2>&1); then
          echo "$out";
          echo "FAIL: generate_cursor_rules.sh exited non-zero (see above).";
          exit 1;
          fi;
          echo "$out";
          if echo "$out" | grep -qE "\[DRY-RUN\]|would remove:"; then
          echo "FAIL: Cursor rules/mcp.json/agents are out of sync with source.";
          echo "If skills were just pulled, run configs/claude/scripts/generate_skill_mirror.sh first.";
          echo "Then run configs/claude/scripts/generate_cursor_rules.sh and commit the result.";
          exit 1;
          fi'
        language: system
        pass_filenames: false
        files: "^(\\.apm/skills/|configs/claude/agents/|configs/claude/agents-devpanel/|configs/claude/config/mcp_servers\\.yml|configs/cursor/(rules\
          |mcp\\.json|agents)/)"

      # Detect stale repo-relative .claude/ paths after configs/ migration
      # Only scans docs and root markdown — configs/, tests/, and templates/
      # legitimately reference deployed ~/.claude/ paths.
      - id: check-stale-repo-paths
        name: Check for stale repo-relative paths
        entry: >-
          bash -c '
          found=0;
          for f in "$@"; do
          out=$(grep -nE "\.claude/(scripts|config|commands|prompts|skills|\.plans)/" "$f"
          | grep -vE "~/\.claude/" | grep -vE "configs/claude/"
          | grep -vE "\\\$HOME/\.claude/" | grep -vE "\\$\\{HOME\\}/\.claude/" || true);
          if [ -n "$out" ]; then
          echo "Stale repo path in $f:"; echo "$out"; found=1;
          fi; done;
          exit $found' --
        language: system
        types: [markdown]
        # docs/superpowers/{plans,specs}/ are design docs that legitimately quote
        # paths (plans embed bats fixtures writing a fake $FHOME/.claude/... path;
        # specs document stale paths being fixed) — excluded like tests/.
        # specs/ (speckit layout) is the same category as docs/superpowers/specs/
        # and was missed when it was added: spec artifacts quote deployed paths
        # verbatim as evidence. Feature 522's decision-record.md embeds raw `apm
        # install` transcripts and apm.lock.yaml excerpts whose .claude/skills/…
        # paths live inside a throwaway isolated HOME, not this repo. Rewording
        # them to satisfy the grep would falsify recorded tool output, which is
        # the one thing a decision record must not do.
        exclude: "^(\\.pre-commit-config\\.yaml|\\.Jules/|configs/|tests/|\\.claude/|specs/|docs/superpowers/plans/|docs/superpowers/specs/|docs/temp\
          lates/)"

      # Rust format + lint — DORMANT/guarded (feature 366): only runs when .rs
      # files are staged AND a Cargo.toml exists. Avoids the unmaintained
      # doublify/pre-commit-rust; uses the local cargo toolchain.
      - id: cargo-fmt-check
        name: cargo fmt --check (Rust)
        entry: bash -c 'test -f Cargo.toml || exit 0; cargo fmt --all -- --check'
        language: system
        types_or: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy -D warnings (Rust)
        entry: bash -c 'test -f Cargo.toml || exit 0; cargo clippy --all-targets -- -D warnings'
        language: system
        types_or: [rust]
        pass_filenames: false

      # Python type checking (feature 366) — opt-in via the manual stage until
      # typed coverage grows: `pre-commit run pyright --hook-stage manual`.
      - id: pyright
        name: pyright (type check, opt-in)
        entry: pyright
        language: system
        types_or: [python, pyi]
        stages: [manual]
        pass_filenames: false

# Global settings
default_language_version:
  python: python3

exclude: ^(\.Jules/|\.git/|\.agent_outputs/|node_modules/)
