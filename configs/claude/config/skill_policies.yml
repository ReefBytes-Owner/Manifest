# Skill registry — the EXOGENOUS truth about the catalog (T0.7 + T1.5, spec 674).
#
# Exists because every partition gate the cutover needs would otherwise derive
# BOTH sides of its equality from the tree produced by the move. If one skill
# directory failed to move, the union of the plugin manifests and the count on
# disk would agree with each other and disagree with reality, and every gate
# would stay green. A committed integer is the only thing the move cannot edit.
#
# A PR that adds or removes a skill MUST change the matching partition count and
# catalog expected_total in the same commit, and give the new skill a bundle or
# classify it as an independent marketplace addon.
domain_expected_total: 122
addon_expected_total: 0
# Eight canonical domains plus the policy addon. This deliberately excludes
# independent marketplace addons from the policy partition.
policy_expected_total: 122
independent_addon_expected_total: 0
# Marketplace addons are intentionally installable without selecting a domain
# bundle, but still appear in the global catalog and reference-validation gate.
independent_addons: {}
# The exact global mirror/catalog count, including independent marketplace
# addons. Consumers that inspect every installed skill must use this field.
expected_total: 122

# Codex loads skill names, descriptions, and paths into the initial model prompt,
# capped at 2% of context (or 8,000 characters when context is unknown). Keep only
# automatic routing and discovery entry points implicit; every other installed
# skill remains available through explicit `$bundle:skill` invocation.
codex_implicit_invocation_allowlist:
  - manifest-code-quality:antipattern-detect
  - manifest-security:code-audit
  - manifest-workspace:help

# Semantic activation guidance for agents, not a keyword-matching runtime hook.
implicit_invocation_triggers:
  manifest-security:code-audit:
    any_of:
      - explicit_security_review_request
      - security_boundary_behavior_change
    non_triggers:
      - nonsecurity_cache_hash
      - session_variable
      - generic_input_or_pattern_token
      - file_size_or_complexity
    instructions: >-
      Activate for an explicit security review request or changed behavior at an
      authentication, authorization, cryptography, secret-handling, validation,
      or other trust boundary. Establish the affected boundary and changed behavior
      from code and context; vocabulary such as input, pattern, hash, or session
      alone is insufficient. Complexity is advisory, not an activation condition.
# Recorded so no later phase keys anything on it: ~/.claude/skills/.deployed-skills
# is ALREADY WRONG on a live machine (measured 2026-07-30 — mtime predates SC-006,
# 108 entries against 109 dirs, code-audit-constitution unlisted, print-tune-bambu
# listed and gone). Its only two writers were both stood down while apm kept
# mutating the tree, so it is dead state presenting as live. T1.12 fixes it.
deployed_skills_manifest_trustworthy: false

# --- bundle assignment (T1.5) --------------------------------------------- #
#
# Derived from partition-map.md's ten bundle tables, which parse clean: 108
# distinct skills, none unassigned, none duplicated, every count matching its
# declared header. Then the shipping transformation from cutover-plan.md:
# manifest-data-pipelines DELETED, manifest-ci DISSOLVED, manifest-runtime-ops
# renamed manifest-ops.
#
# ASSUMPTION, STATED BECAUSE IT WAS A REAL FORK. The plan's scatter rule ("along
# their members' own subject-lens votes") and T3.1's declared counts DISAGREE:
# subject votes alone send +7/+2, giving code-quality 25 and ops 8, while T3.1
# declares 22/11. Both total 108, so no count gate can catch the difference and
# T3.6's disjointness check cannot see a MISplacement either.
#
# Resolved in favour of T3.1's counts, because they are load-bearing in more
# places (T4.3's install order, T3.6's per-bundle assertions) than a heuristic
# for placing nine orphans. The nine are then split on the strongest recorded
# signal rather than arbitrarily:
#
#   -> manifest-ops   ci-setup (journey=deploy-ops, explicit), ci-diagnose-drift
#                     and ci-reproduce-failure (pipeline-environment work, and
#                     their subject=ci-testing bundle no longer exists),
#                     cache-warm-oob + process-diagnose-stall (subject=environment)
#   -> manifest-code-quality
#                     api-optimize-bulk, data-design-ingestion, data-wire-field
#                     (subject=code-quality), data-validate-live (subject=ci-testing;
#                     the test/validation craft cluster lives here)
#
# That lands exactly on 22/11. REVISABLE: if the scatter rule is meant to be
# authoritative instead, move the three CI skills to code-quality and update
# T3.1 to 25/8. Nothing else depends on which way this went.
