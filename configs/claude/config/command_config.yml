# Version-pinning rule set (consumed by scripts/version_pin.sh).
# Maps file globs to an ecosystem and hash form. Notes on the fields:
#   ecosystem   - selects the parser AND the native resolver inside the script
#                 (pip -> pip/pip-compile, docker -> docker manifest inspect).
#   hash        - ENFORCED: required|digest mean a missing hash/digest makes the
#                 entry 'unresolved' (file left untouched); optional|none allow a
#                 version-only pin.
#   resolve_cmd - ADVISORY only: documents which native tool the ecosystem uses.
#                 The script maps ecosystem->tool internally; editing resolve_cmd
#                 does not change behavior (override resolution via
#                 VERSION_PIN_RESOLVER instead).
version_pin:
  bypass_marker: "version-pin:ignore"
  rules:
    - id: pip-requirements
      match: ["requirements.txt", "requirements*.txt"]
      ecosystem: pip
      resolve_cmd: "pip-compile --generate-hashes"
      hash: required
    - id: docker-compose
      match: ["docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]
      ecosystem: docker
      resolve_cmd: "docker manifest inspect"
      hash: digest
    - id: dockerfile
      match: ["Dockerfile", "Dockerfile.*", "*.Dockerfile"]
      ecosystem: docker
      resolve_cmd: "docker manifest inspect"
      hash: digest
      # Extensible: add a rule above + a matching parser in version_pin.sh to
      # cover more ecosystems, e.g.:
      #   - id: npm-package
      #     match: ["package.json"]
      #     ecosystem: npm
      #     resolve_cmd: "npm view"
      #     hash: optional
      #   - id: github-actions
      #     match: [".github/workflows/*.yml"]
      #     ecosystem: gha
      #     resolve_cmd: "git ls-remote"
      #     hash: required   # mutable ref -> full commit SHA

# Branch-cleaner policy (consumed by scripts/branch_clean.sh).
branch_clean:
  stale_days: 90
  protected:
    - main
    - master
    - "release/*"
    - "hotfix/*"

# Error recovery strategies
error_recovery:
  timeout_seconds: 120
  max_retries: 1
  fallback_strategy: single_agent  # Options: single_agent, warn_user, abort

  on_timeout:
    action: retry_once_then_fallback
    message: "Parallel agents timed out, falling back to single-agent analysis"

  on_one_agent_fails:
    action: continue_with_available
    message: "One agent failed, continuing with available agent output"

  on_both_agents_fail:
    action: warn_and_proceed
    message: "Both agents failed, proceeding without parallel validation"

  on_synthesis_fails:
    action: show_raw_outputs
    message: "Synthesis failed, presenting raw agent outputs"

# Parallel agent script configuration
parallel_agent:
  script_path: ~/.claude/scripts/parallel_agent.py
  output_dir: ~/.claude/.agent_outputs
  default_options:
    - --json
    - --validate
  modes:
    review: --review
    analyze: --analyze
    prompt: ""  # Generic prompt mode

# Model selection
# Canonical model tier definitions (IDs and fallback chains) are in parallel_agent.yml.
# This section only contains task-based routing logic (which tier to use per task type).

# Task-based model defaults (used by orchestrator)
# The orchestrating agent (Claude) selects models based on task type
task_model_defaults:
  security:
    cursor: advanced
    claude: opus
    gemini: pro
    antigravity: advanced
    reason: "Security-critical code requires maximum model capability"

  review:
    cursor: flash
    claude: sonnet
    gemini: flash
    antigravity: flash
    reason: "Code review benefits from balanced capability/speed"

  analyze:
    cursor: flash
    claude: sonnet
    gemini: flash
    antigravity: flash
    reason: "Analysis tasks need good reasoning without opus cost"

  improve:
    cursor: mini
    claude: haiku
    gemini: flash
    antigravity: mini
    reason: "Improvement suggestions can use lighter models"

  quick:
    cursor: mini
    claude: haiku
    gemini: flash
    antigravity: mini
    reason: "Quick queries use lightest models for speed"

  issue_triage:
    cursor: flash
    claude: sonnet
    gemini: flash
    antigravity: flash
    reason: "Balanced capability for semantic analysis"

  issue_prioritize:
    cursor: flash
    claude: sonnet
    gemini: flash
