# Command Configuration
# Thresholds and policies for Claude Code native commands
# Referenced by commands in ~/.claude/commands/

# Parallel agent trigger thresholds (configurable)
thresholds:
  # Documentation commands
  docs_improve_lines: 500         # Trigger parallel agents when total doc lines > 500
  docs_diagrams_modules: 5       # Trigger when analyzing 5+ unique imports/modules

  # Advisory complexity signals; never independently activate code-audit or review fan-out.
  skill_file_lines: 500           # File > 500 lines
  skill_function_count: 10        # > 10 functions per file
  skill_class_count: 5            # > 5 classes per file
  skill_cyclomatic_complexity: 15  # Cyclomatic complexity > 15

# Security search vocabulary only; semantic activation is in skill_policies.yml.
security_patterns:
  # Authentication/authorization
  - auth
  - login
  - session
  - jwt
  - oauth

  # Cryptography
  - crypto
  - encrypt
  - decrypt
  - hash
  - salt

  # Secrets handling
  - secret
  - api_key
  - password
  - token
  - credential
  - private_key

  # Input validation
  - sanitize
  - validate
  - escape
  - filter

# Canonical review-routing policy. Counts and vocabulary never escalate alone.
review_escalation:
  default_mode: single-agent
  conditions:
    - trust_boundary_change
    - destructive_behavior
    - broad_compatibility_or_deployment_change
    - conflicting_evidence_or_unresolved_uncertainty
    - codebase_wide_independent_tracks
  trigger_condition: &review_risk_trigger >-
    trust_boundary_change OR destructive_behavior OR broad_compatibility_or_deployment_change OR
    conflicting_evidence_or_unresolved_uncertainty OR codebase_wide_independent_tracks
  non_triggers:
    - file_size
    - package_count
    - module_count
    - language
    - generic_keyword
    - independent_unit_count
  verification:
    mode: check-only
    missing_tool_result: unavailable
    checkout_trust: untrusted
    allowed_without_isolation:
      - trusted_preinstalled_static_tool_treating_checkout_as_data
    requires_verified_isolation:
      - project_controlled_tests_scripts_and_build_steps
      - checkout_controlled_executable_config_plugins_hooks_imports_or_discovery
    insufficient_isolation:
      - source_inspection
      - check_only_flags
      - changed_home
      - temporary_directory
      - read_only_checkout
    unavailable_isolation_result: skip_and_report_unavailable
    forbidden_operations:
      - automatic_fixes
      - format_writes
      - installations
      - deployments
      - remediation
  report_fields:
    - review_mode
    - escalation_reason
    - checks

# Consensus thresholds for parallel agent decisions (float 0.0-1.0)
consensus:
  high: 0.80    # >=80%: Auto-proceed with unified recommendation
  medium: 0.50  # 50-79%: Highlight disagreements to user
  low: 0.0      # <50%: Block and escalate for human review

# Prioritization hierarchy for synthesis (in order)
synthesis_priority:
  - security        # Security issues always first
  - correctness     # Functional bugs
  - performance     # Performance issues
  - maintainability  # Code quality
  - style           # Formatting and style

# Harness routing (2026-08-02) — the four supported execution harnesses and how
# skills/agents resolve models and execution semantics under each. Model IDs are
# deliberately NOT duplicated here: parallel_agent.yml `model_tiers` is the
# single verified-pin source (doc-sourced ID copies are how the gemini tiers
# ended up 404-ing). `tier_source` names that file's model_tiers key;
# `default_model_tier` mirrors _MODEL_TIER_DEFAULTS in scripts/agents/cli.py
# ("auto" = no --model flag; the account default stands). Per-skill Claude
# sub-agent/session models remain in tool_policies below.
harness_routing:
  claude:
    guide: configs/claude/CLAUDE.md          # deployed to ~/.claude/CLAUDE.md
    tier_source: claude
    default_model_tier: sonnet               # sub-agent pin; session model via tool_policies session_model
    execution: native-tools                  # Read/Edit/Grep/Bash signatures + Task/Agent sub-agents
  codex:
    guide: AGENTS.md                         # AGENTS.md standard; symlinked at configs/codex/AGENTS.md
    tier_source: codex
    default_model_tier: auto                 # no --model sent; account default follows OpenAI rollout
    execution: direct-shell                  # direct shell execution; output as unified diffs
  cursor:
    guide: configs/cursor/rules/orchestration.mdc
    tier_source: cursor
    default_model_tier: flash
    execution: workspace-edits               # workspace context constraints; edits applied to files
  agy:
    guide: AGENTS.md                         # antigravity ships no guide of its own (provider, not orchestrator)
    tier_source: antigravity
    default_model_tier: flash
    execution: agent-context                 # standard agent context wrapper

# Tool policies per command
#
# Sub-agent fields (feature 367 — see configs/claude/references/sub-agent-dispatch.md):
#   parallel_agents: always|conditional|never|gate-only  # external parallel_agent.py cross-verification
#   trigger_condition: "<expr>"                           # scale gate for parallel_agents: conditional
#   subagents:         always|conditional|never           # native Task/Agent sub-agents (Claude)
#   subagent_trigger:  "<expr>"                            # REQUIRED when subagents: conditional; convention: independent_units >= 3
#   subagent_rationale: "<one line>"                       # for subagents: never (or a `> Sub-agents: not used — <reason>.` note in SKILL.md)
#   subagent_model:    haiku|sonnet|opus|charter           # REQUIRED when subagents: always|conditional. Default `sonnet`;
#                                                          # `charter` = per-role tiers in the CDDL charters. Escalate to `opus`
#                                                          # only for genuinely hard reasoning (measured: 2026-07-25 baseline).
# Every skill directory with a SKILL.md MUST carry a `subagents` value (enforced by tests/bats/subagent_policy.bats).
# command_config.yml is the canonical store; SKILL.md prose must agree and is verified by that test.
#
# Session-model fields (2026-07-25 credit baseline — see docs/MODEL-POLICY.md):
#   session_model:           opus                          # omit = Opus, the default start model
#   session_model_rationale: "<one line>"                  # REQUIRED whenever session_model is set
# 2026-08-17: the `fable` session tier was retired. Opus (1M context) is now both the top tier and
# the default start model, so there is no costlier tier left to ask the user to switch to — the
# ask-before-premium gate that `fable` carried has no referent and was removed with it.
# Enforced by tests/bats/subagent_policy.bats.
tool_policies:
  issue-dev-auto:
    allowed:
      - Bash       # auto_issue_dev.sh, git_ops.sh, pr_merge_loop.sh, merge_decision.sh, verification_gate.sh, loop_lock.sh, gh/glab
      - Read
      - Edit       # writes code for the selected issue
      - Write
      - Skill      # test-driven-development, project-verify, pr-address-comments, pr-review
    forbidden: []
    # Scope note: the DEVELOP loop never auto-wraps its own output in cross-verification
    # (parallel_agents: never). The MERGE gate, however, is a deliberate, bounded parallel-agent
    # review run via verification_gate.sh (#360) — that is gate-only and intentional, not a
    # contradiction of the develop-loop policy.
    parallel_agents: gate-only
    validation_tier: 1

    subagents: never
    subagent_rationale: Develops exactly one issue per invocation then stops; /loop handles iteration.
  pr-monitor:
    allowed:
      - Bash
      - Read
      - Edit
      - Write
    forbidden: []
    parallel_agents: never        # orchestrates other skills; no cross-verification fan-out
    validation_tier: 1            # pushes commits + posts PR comments

    subagents: never
    subagent_rationale: Self-paced interactive loop babysitting a single PR sequentially.
  pr-smoke:
    allowed:
      - Bash       # run_pr_regression.sh: lint/bats/pytest, bootstrap, check_status, parallel_agent
      - Read
      - Skill      # may hand a failing gate to systematic-debugging
    forbidden:
      - Write      # read-only on repo source; only validates, never edits
      - Edit
    parallel_agents: never        # a CI-mirror gate runner, not a cross-verification fan-out
    validation_tier: 2            # verification skill; no source mutation

    subagents: never
    subagent_rationale: Single deterministic bundled runner executing sequential whole-repo gates.
  smoke-manage:
    allowed:
      - Bash       # smoke_test.py append/run/list/prune; opt-in playwright install
      - Read
      - Write      # appends/updates committed smoke-catalog/<app>.yaml
      - Edit
      - Skill      # may hand a failing gate to systematic-debugging
    forbidden: []
    parallel_agents: never        # an authoring/gate tool, not a cross-verification fan-out
    validation_tier: 1            # executes CLI/shell steps + handles env-injected secrets
    subagents: never
    subagent_rationale: Single config-driven engine runs the tiered catalog sequentially via one smoke_test.py run; no independent fan-out units.

  lifecycle-run:
    allowed:
      - Bash       # lifecycle.sh init/status/advance/subtask/provision/verdict/reconcile/audit; smoke_test.py; spec_review.sh
      - Read
      - Write      # per-track JSON state under the Manifest state root
      - Edit
      - Skill      # drives the per-phase /speckit-* and /spec-review commands
    forbidden: []
    parallel_agents: never        # a state-gated driver, not a cross-verification fan-out
    validation_tier: 1            # safety-gate logic + handles env-injected provider secrets
    subagents: never
    subagent_rationale: Single config-driven engine runs the catalog sequentially via one script.
  issue-sync-pr:
    allowed:
      - Bash
      - Read
    forbidden:
      - Write
      - Edit
    parallel_agents: never
    validation_tier: 1
    enabled: true              # opt-in runtime gate (install_issue_hooks.sh --enable)
    hook_timeout_seconds: 5     # fail-open soft timeout bound

    subagents: never
    subagent_rationale: Single-PR fail-open hook mutating tracker issue state.
  issue-sync-commit:
    allowed:
      - Bash
      - Read
    forbidden:
      - Write
      - Edit
    parallel_agents: never
    validation_tier: 1
    enabled: true              # opt-in runtime gate
    hook_timeout_seconds: 5     # fail-open soft timeout bound
    commit_hook_mode: sync      # sync only in v1; 'background' reserved (falls back to sync)

    subagents: never
    subagent_rationale: Fail-open hook mutating one linked issue per commit; sequential shared-state.
  docs-improve-readme:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # docs_lint.py only — the line cap must be measured, not judged
    parallel_agents: never
    validation_tier: 2

    subagents: never
    subagent_rationale: 'Single-target: improves one README from code-derived facts.'
  python-refactor:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Check-only verification under review_escalation.verification
    forbidden:
      - Write
      - Edit  # Read-only analysis
    bash_mode: check-only
    parallel_agents: conditional
    trigger_condition: *review_risk_trigger
    validation_tier: 1
    mcp_servers:
      - context7   # Python library/API documentation
      - deepwiki   # Dependency internals and upstream contracts

    subagents: conditional
    subagent_trigger: *review_risk_trigger
    subagent_model: sonnet
  code-audit-constitution:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash    # constitution_check.py, the language toolchain, the test suite
      - Write   # extracted payload/template files and their tests
      - Edit    # remediation: this skill changes source, unlike <lang>-refactor
    parallel_agents: conditional
    validation_tier: 2
    mcp_servers:
      - context7   # library/API docs when a loader or dependency is evaluated

    subagents: conditional
    subagent_trigger: independent_units >= 3
    subagent_model: sonnet
  docs-generate-diagrams:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # docs_lint.py only — the page/diagram caps must be measured
    parallel_agents: conditional
    trigger_condition: unique_imports >= 5
    validation_tier: 2

    subagents: never
    subagent_rationale: One diagram doc for a single codebase; uses parallel_agent.py, not native fan-out.
  docs-improve:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # docs_lint.py only — before/after caps are a measured delta
    parallel_agents: conditional
    trigger_condition: total_doc_lines >= 500
    validation_tier: 2
    mcp_servers:
      - deepwiki   # Cross-reference dependency docs for accuracy
      - context7   # Library/API docs for code examples in documentation

    subagents: conditional
    subagent_trigger: doc_topics >= 10
    subagent_model: sonnet
    subagent_rationale: >-
      Was `never` when the output was one holistic health score. The unit of
      work is now a topic directory held to its own line cap, and those are
      independent — above ~10 docs, one sub-agent per topic.
  shell-refactor:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Check-only verification under review_escalation.verification
    forbidden:
      - Write
      - Edit  # Read-only analysis
    bash_mode: check-only
    parallel_agents: conditional
    trigger_condition: *review_risk_trigger
    validation_tier: 1
    security_cli:
      - semgrep    # Local SAST scanning via CLI (requires Bash)

    subagents: conditional
    subagent_trigger: *review_risk_trigger
    subagent_model: sonnet
  node-refactor:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Check-only verification under review_escalation.verification
    forbidden:
      - Write
      - Edit  # Read-only analysis
    bash_mode: check-only
    parallel_agents: conditional
    trigger_condition: *review_risk_trigger
    validation_tier: 1
    mcp_servers:
      - context7   # Node/TS library documentation
      - deepwiki   # Dependency internals and upstream contracts

    subagents: conditional
    subagent_trigger: *review_risk_trigger
    subagent_model: sonnet
  go-refactor:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Check-only verification under review_escalation.verification
    forbidden:
      - Write
      - Edit  # Read-only analysis
    bash_mode: check-only
    parallel_agents: conditional
    trigger_condition: *review_risk_trigger
    validation_tier: 1
    mcp_servers:
      - context7   # Go library documentation
      - deepwiki   # Dependency internals and upstream contracts

    subagents: conditional
    subagent_trigger: *review_risk_trigger
    subagent_model: sonnet
  terraform-refactor:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Check-only verification under review_escalation.verification
    forbidden:
      - Write
      - Edit  # Read-only analysis
    bash_mode: check-only
    parallel_agents: conditional
    trigger_condition: *review_risk_trigger
    validation_tier: 1
    mcp_servers:
      - opentofu   # OpenTofu registry, provider/module docs, resource reference
    security_cli:
      - semgrep    # Local SAST scanning via CLI (requires Bash)

    subagents: conditional
    subagent_trigger: *review_risk_trigger
    subagent_model: sonnet
  plan-manage:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # parallel_agent.py, git_ops.sh, mv, date
      - Write  # Creating new plans from template
      - Edit   # Checking off deliverables during execute
      - Task   # Synthesis agent on disagreement
    forbidden: []
    parallel_agents: conditional
    trigger_condition: security OR architecture OR scope >= 3 files OR critical_logic OR issue_execute_review
    validation_tier: 2
    mcp_servers:
      - deepwiki   # Research external deps and upstream APIs during planning
      - linear     # Issue context and acceptance criteria
      - atlassian  # Jira/Confluence context when project uses Atlassian
      - glean      # Internal team knowledge, runbooks, ADRs
      - opentofu   # OpenTofu registry docs when planning IaC changes

    # Was `never` while SKILL.md step 4 dispatched a general-purpose synthesis
    # agent with no model — `never` exempts a skill from the T7/T8 model-pin
    # gate, so the one dispatch it made inherited the session's premium model
    # unchecked. Reclassified to match what the skill actually does.
    subagents: conditional
    subagent_trigger: consensus 50-79% on `create` — one synthesis agent merges the panel's proposals
    subagent_rationale: Interactive plan-lifecycle management acting on one plan per action; the sole dispatch is the consensus-synthesis agent.
    subagent_model: sonnet
  code-audit:  # skill
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Check-only verification under review_escalation.verification
    forbidden:
      - Write
      - Edit  # Read-only for auto-trigger
    bash_mode: check-only
    parallel_agents: conditional
    trigger_condition: *review_risk_trigger
    validation_tier: 1
    mcp_servers:
      - context7   # Library docs for security best practices
    security_cli:
      - semgrep    # Local SAST scanning via CLI (requires Bash)

    subagents: conditional
    subagent_trigger: *review_risk_trigger
    subagent_model: sonnet
    subagent_rationale: Inline review by default; independent review on consequence or uncertainty.
  issue-triage:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # linear_ops.sh, parallel_agent.py, jq
      - Task      # Parallel verification for duplicates/staleness
      - AskUserQuestion  # User confirmation for actions
    forbidden:
      - Write
      - Edit      # Read-only analysis; mutations via linear_ops.sh only
    parallel_agents: conditional
    trigger_condition: scenario_based
    validation_tier: 2
    mcp_servers:
      - linear      # Primary: Linear MCP for issue operations
      - atlassian   # Alternative: Jira issues when project uses Atlassian

    subagents: conditional
    subagent_trigger: independent_units >= 3
    subagent_model: sonnet
  issue-prioritize:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # gh, glab, linear_ops.sh, parallel_agent.py, jq, python3
      - Task      # Parallel agent scoring for top candidates
      - AskUserQuestion  # Clarify platform or project context
    forbidden:
      - Write
      - Edit      # Strictly read-only — no file or issue mutations
    parallel_agents: conditional
    trigger_condition: top_candidates_scoring
    validation_tier: 2
    mcp_servers:
      - linear      # Primary: Linear issue data
      - atlassian   # Alternative: Jira issues when project uses Atlassian

    subagents: conditional
    subagent_trigger: open_issues >= 10
    subagent_model: sonnet
  issue-prep-auto:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # git_ops.sh (issue-view/edit/comment), auto_issue_dev.sh, audit_log.sh, jq
      - Task      # Optional parallel review for ambiguous/large issues
      - AskUserQuestion  # Confirm label/description/comment mutations
    forbidden:
      - Write
      - Edit      # No filesystem mutations; issue mutations go through git_ops.sh
    parallel_agents: conditional
    trigger_condition: scenario_based
    validation_tier: 2

    subagents: never
    subagent_rationale: Preps exactly one issue and mutates its labels/body; single-target.
  spec-audit-tasks:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # check-prerequisites.sh, /project-verify, test runners, git, jq
      - Task      # Parallel per-task verification
    forbidden:
      - Write
      - Edit      # Analysis-only — reports gaps, never edits code or the task list
    parallel_agents: conditional
    trigger_condition: post_implement
    validation_tier: 2

    subagents: conditional
    subagent_trigger: independent_units >= 3
    subagent_model: sonnet
  spec-implement-loop:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # git state, verification gates, artifact discovery
      - Task      # CDDL personas: developer + three read-only reviewers/critics
    forbidden:
      - Write
      - Edit      # Only the developer sub-agent writes code
    parallel_agents: never
    validation_tier: 1

    subagents: always
    subagent_rationale: Four-persona CDDL loop; developer sub-agent is the sole code author; three read-only reviewer sub-agents gate each iteration.
    subagent_model: charter
  env-check:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # CLI version checks, auth status, curl, stat, test
    forbidden:
      - Write
      - Edit      # Read-only diagnostic
      - Task
    parallel_agents: never
    validation_tier: 2

    subagents: never
    subagent_rationale: Diagnoses one environment into a single summary table; sequential checks.
  config-audit:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # stat, readlink, diff
    forbidden:
      - Write
      - Edit      # Read-only diagnostic
      - Task
    parallel_agents: never
    validation_tier: 2

    subagents: never
    subagent_rationale: Single sequential audit collecting checks into one drift summary.
  token-conserve:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
    parallel_agents: never
    validation_tier: 2

    subagents: never
    subagent_rationale: Session-mode mutator that changes output behavior; nothing to dispatch.
  version-pin:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # Invokes native package managers (pip, docker, npm) to resolve versions/hashes
      - Edit
      - Write  # Rewrites loose pins in place on explicit (on-demand) invocation
    parallel_agents: always   # Security-sensitive supply-chain change (Constitution II)
    validation_tier: 1

    subagents: never
    subagent_rationale: Thin wrapper running one tree-walking script that mutates files in place.
  docker-compose-commandments:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # compose_check.py; may also invoke version_pin.sh for DC-001
      - Edit   # Applies the remedy to the compose file under audit
    parallel_agents: conditional   # Escalate when the fix touches secrets or network topology
    validation_tier: 1             # DC-002/DC-005 are security-sensitive (Constitution II)
    subagents: never
    subagent_rationale: One checker over one file; the fix is a targeted edit, not a fan-out.
  docs-all:
    allowed:
      - Read
      - Glob
      - Grep
      - Task   # Dispatches docs-improve-readme / docs-generate-diagrams / docs-improve as sub-agents
      - Bash   # docs_lint.py only — brackets the run to report a real delta
    parallel_agents: conditional
    validation_tier: 2

    subagents: always
    subagent_model: sonnet
  pr-review:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # Wraps git_ops.sh / gh / glab (read-only enumeration)
    forbidden:
      - Write
      - Edit   # Analysis-only by default (FR-014)
    parallel_agents: never
    validation_tier: 2

    subagents: conditional
    subagent_trigger: independent_units >= 3
    subagent_model: sonnet
  branch-clean:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # git plumbing; branch deletion only on --apply
    parallel_agents: conditional   # Tier 1 on the destructive --apply path
    validation_tier: 1

    subagents: never
    subagent_rationale: Single script run mutating the shared local branch set; parallelism unsafe.
  deploy-reconcile:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # reconcile_core.py preview; file moves only on the destructive --remove path
    parallel_agents: conditional   # Tier 1 on the destructive --remove path
    validation_tier: 1

    subagents: never
    subagent_rationale: Single script run mutating the user's deployed home; parallelism unsafe.
  repo-clean:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # composes pr_review.sh / branch_clean.sh / hygiene_gather.py; close+delete only after confirm
    forbidden:
      - Write
      - Edit   # report-first; never edits repo files
    parallel_agents: conditional   # Tier 1 on the destructive close/prune path
    validation_tier: 1

    subagents: conditional
    subagent_trigger: independent_units >= 3
    subagent_model: sonnet
  token-benchmark:
    allowed:
      - Read
      - Bash
      - Write
    description: "Token benchmark harness — runs Python scripts and reads/writes result files"
    subagents: never
    subagent_rationale: Single benchmark harness run via one script; provider sweep handled internally.
  a11y-audit:
    subagents: conditional
    subagent_trigger: target_files >= 3
    subagent_model: sonnet
  parallel-agent:
    subagents: never
    subagent_rationale: The skill is the cross-harness invocation mechanism itself; nested fan-out would duplicate its bounded worker set.
  pr-address-comments:
    subagents: never
    subagent_rationale: Single PR; fixes mutate one working tree and must be re-tested/pushed sequentially.
  ai-hooks-integration:
    subagents: never
    subagent_rationale: Single hook-install operation editing shared config files; not a multi-item fan-out.
  code-to-design:
    subagents: never
    subagent_rationale: "Vendored Stitch MCP skill (retired skill supply): single sequential design-upload workflow, not a fan-out."
  design-md:
    subagents: never
    subagent_rationale: "Vendored Stitch MCP skill (retired skill supply): single-project analysis producing one DESIGN.md."
  enhance-prompt:
    subagents: never
    subagent_rationale: "Vendored Stitch MCP skill (retired skill supply): single-prompt rewrite, not a multi-item fan-out."
  extract-design-md:
    subagents: never
    subagent_rationale: "Vendored Stitch MCP skill (retired skill supply): single-project source scan producing one DESIGN.md."
  extract-static-html:
    subagents: never
    subagent_rationale: "Vendored Stitch MCP skill (retired skill supply): single-target HTML extraction."
  generate-design:
    subagents: never
    subagent_rationale: "Vendored Stitch MCP skill (retired skill supply): single design-generation request against the Stitch MCP server."
  manage-design-system:
    subagents: never
    subagent_rationale: "Vendored Stitch MCP skill (retired skill supply): single design-system upload/apply operation."
