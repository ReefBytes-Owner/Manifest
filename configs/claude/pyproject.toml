[project]
name = "manifest-runtime"
version = "0.0.0"
description = "Manifest home-deployed Python runtime"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0; python_version >= '3.9'",
  "google-generativeai>=0.8.0",
  "google-auth>=2.0.0",
  "aiohttp>=3.9.0",
  "asyncio-throttle>=1.0.0",
  "pyyaml>=6.0.1",
  "rich>=13.0.0",
  "click>=8.1.0",
  "manifest-model-policy==0.1.0",
]

[project.scripts]
manifest = "manifest_cli:main"

[dependency-groups]
claude = ["anthropic>=0.40.0"]
smoke = ["playwright==1.62.0"]
smoke-agent = ["browser-use>=0.13.0"]

[tool.uv]
package = true
# Resolves smoke-agent (browser-use) vs google-generativeai under universal lock;
# see docs/superpowers/specs/2026-07-13-manifest-uv-cli-design.md
override-dependencies = ["google-api-core==2.29.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "scripts/agents",
  "scripts/smoke_orchestrator",
  "scripts/skillclaw",
  "scripts/manifest_cli",
]

[tool.hatch.build.targets.wheel.sources]
"scripts/agents" = "agents"
"scripts/smoke_orchestrator" = "smoke_orchestrator"
"scripts/skillclaw" = "skillclaw"
"scripts/manifest_cli" = "manifest_cli"

[tool.uv.sources]
# Non-editable: `config-env` is a provisioned toolchain-store bundle, not a
# dev-iteration checkout, so its manifest-model-policy must be a real,
# hash-recorded distribution built into site-packages (RECORD-verifiable) --
# an editable install's direct_url.json points at the provisioning checkout
# it happened to run from, which a candidate materialized to a different
# path can never satisfy (phase-3-5-decisions.md Correction 9 rule 4).
manifest-model-policy = { path = "scripts/manifest_model_policy" }
