# The `python-env` toolchain-store bundle (phase-3-5-decisions.md Correction 3,
# chunk C7b). This project's only purpose is to pin the exact console-script
# tools `manifest provision` materializes into the store -- it ships no code
# of its own and is never installed as a dependency of the Manifest package.
#
# Every version below is an exact pin, matching config/project-checks.json's
# `expected_version` fields and docs/SHARED_CHECKS.md. `uv sync --locked`
# refuses to proceed if `uv.lock` drifts from this file, and `manifest
# provision` refuses to proceed if the resulting distribution set's digest
# does not match the lock's committed `exe_sha256` -- so bumping a pin here
# requires regenerating `uv.lock` AND re-attesting `config/toolchain.lock.json`
# in the same reviewed change.
#
# semgrep and pip-audit have no version named anywhere in the registry or
# docs/SHARED_CHECKS.md; these two pins were chosen as "current latest on
# PyPI at authoring time" per the C7b task instructions and are flagged here
# for a reviewer to confirm or replace with an intentional pin.
[project]
name = "manifest-toolchain-python-env"
version = "0.0.0"
description = "Pinned console-script tools materialized into the python-env toolchain store"
requires-python = ">=3.11"
dependencies = [
    "ruff==0.15.20",
    "pytest==8.3.4",
    "pre-commit-hooks==6.0.0",
    "yamllint==1.38.0",
    "pyyaml==6.0.2",
    # FLAGGED: no version pinned by the registry or docs/SHARED_CHECKS.md;
    # pinned to PyPI latest as of 2026-09-10.
    "semgrep==1.176.1",
    # FLAGGED: no version pinned by the registry or docs/SHARED_CHECKS.md;
    # pinned to PyPI latest as of 2026-09-10.
    "pip-audit==2.10.1",
]

[tool.uv]
package = false
